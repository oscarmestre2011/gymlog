<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Simbolo de Kairós.

    Sigue el brief de identidad del podcast (vault: "Kairós - Proyecto"):
    marco circular, la omega griega en lugar de la O, y una barra vertical que es a
    la vez el hierro del gimnasio y el eje del tiempo. Paleta del brief:
    carbon #1A1A1A, oro #C9A84C, terracota #C85A3E, blanco calido #F5F0E8.

    Sin detalle fino: este dibujo se ve a 48 px en la pantalla de inicio de un movil.
    El meandro griego del brief se probo y queda tapado por el marco circular, asi
    que se deja fuera. Este dibujo y src/components/KairosMark.tsx deben coincidir.
  -->
  <rect width="512" height="512" rx="112" fill="#1A1A1A"/>

  <g fill="none" stroke-linecap="round">
    <!-- Marco circular: la rueda del tiempo -->
    <circle cx="256" cy="256" r="168" stroke="#F5F0E8" stroke-width="10" opacity="0.92"/>

    <!-- Barra vertical: el hierro y el eje del tiempo -->
    <line x1="256" y1="140" x2="256" y2="372" stroke="#C85A3E" stroke-width="23"/>

    <!-- Discos de la barra -->
    <line x1="196" y1="180" x2="316" y2="180" stroke="#C9A84C" stroke-width="23"/>
    <line x1="196" y1="332" x2="316" y2="332" stroke="#C9A84C" stroke-width="23"/>

    <!-- Omega: la letra griega en lugar de la O -->
    <path d="M206 214 h33 a52 52 0 0 0 34 88 a52 52 0 0 0 34 -88 h33"
          stroke="#F5F0E8" stroke-width="19"/>
  </g>
</svg>
