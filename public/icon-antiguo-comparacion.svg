<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Simbolo de Kairós, segun el brief de identidad del vault:
    - marco circular (la rueda del tiempo)
    - una barra vertical: el hierro y, a la vez, el eje del tiempo
    - la omega (Ω), letra griega, en lugar de la O de Kairós
    - meandro griego arriba y abajo, que evoca el tiempo que pasa (Chronos)
    - paleta: carbon #1A1A1A, oro #C9A84C, terracota #C85A3E, blanco calido #F5F0E8

    Se dibuja con trazos gruesos y sin detalle fino porque un icono de movil se ve
    a 48 px: lo que no se distinga ahi, no sirve.
  -->
  <rect width="512" height="512" rx="112" fill="#1A1A1A"/>

  <g fill="none" stroke-linecap="round">
    <!-- Disco del dia y marco circular -->
    <circle cx="256" cy="256" r="168" stroke="#F5F0E8" stroke-width="10" opacity="0.92"/>

    <!-- Barra vertical (el hierro) -->
    <line x1="256" y1="140" x2="256" y2="372" stroke="#C85A3E" stroke-width="23"/>

    <!-- Discos: arriba y abajo, como una barra cargada vista de frente -->
    <line x1="196" y1="180" x2="316" y2="180" stroke="#C9A84C" stroke-width="23"/>
    <line x1="196" y1="332" x2="316" y2="332" stroke="#C9A84C" stroke-width="23"/>

    <!-- Omega: la letra griega en lugar de la O -->
    <path d="M206 214 h33 a52 52 0 0 0 34 88 a52 52 0 0 0 34 -88 h33"
          stroke="#F5F0E8" stroke-width="19"/>
  </g>

  <!-- Meandro griego arriba y abajo: el tiempo que pasa -->
  <g stroke="#C9A84C" stroke-width="6" fill="none" opacity="0.85">
    <path d="M150 92 h212 M150 92 v16 h196 v16 h-180"/>
    <path d="M150 420 h212 M150 420 v-16 h196 v-16 h-180"/>
  </g>
</svg>
