<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="description" content="Kairós: registro de entrenamientos de gimnasio. Series, rutinas, progresion y cardio. Sin conexion y sin cuentas." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kairós" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Kairós — Entrenamiento</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Esta linea no es decorativa: es la MARCA que dice cual es el archivo de la app en uso.
      La app la usa para compararlo con el publicado y avisar de que hay version nueva.
      El `data-app` va en un `link` y no en el `script` porque el compilador elimina los `id` y
      los `data-` de la etiqueta del script al preparar la version publicada, y en el `link` los
      conserva. Apunta a un archivo real (public/raiz.txt) para no dejar un error 404.
    -->
    <link rel="preload" as="fetch" href="./raiz.txt" data-app="raiz" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
